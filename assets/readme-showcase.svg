<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Freight Scroll Hero — animated logistics illustration</title>
  <desc id="description">A glowing isometric red and cream freight train moves through clouds above a dark landscape, with floating logistics icons.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1200" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111824"/>
      <stop offset=".55" stop-color="#18243A"/>
      <stop offset="1" stop-color="#352944"/>
    </linearGradient>
    <linearGradient id="glow" x1="600" y1="60" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F5EF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#E9B85D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="containerTop" x1="464" y1="160" x2="600" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8E8"/>
      <stop offset="1" stop-color="#D9D4CA"/>
    </linearGradient>
    <linearGradient id="redTop" x1="604" y1="212" x2="743" y2="257" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F05D54"/>
      <stop offset="1" stop-color="#B93135"/>
    </linearGradient>
    <linearGradient id="front" x1="500" y1="195" x2="555" y2="315" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9F6EE"/>
      <stop offset="1" stop-color="#C9C4BA"/>
    </linearGradient>
    <linearGradient id="redFront" x1="654" y1="241" x2="704" y2="338" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E44C49"/>
      <stop offset="1" stop-color="#A92731"/>
    </linearGradient>
    <filter id="shadow" x="300" y="115" width="615" height="290" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="chipShadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#080D17" flood-opacity=".45"/>
    </filter>
    <pattern id="terrain" width="54" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <path d="M0 10h54M0 33h54" stroke="#99A2AF" stroke-opacity=".12" stroke-width="2"/>
      <circle cx="9" cy="21" r="2" fill="#D1D5D9" fill-opacity=".12"/>
      <circle cx="39" cy="43" r="2" fill="#D1D5D9" fill-opacity=".1"/>
    </pattern>
  </defs>

  <rect width="1200" height="470" rx="28" fill="url(#sky)"/>
  <path d="M0 310 1200 145v325H0V310Z" fill="#10151D"/>
  <path d="M0 310 1200 145v325H0V310Z" fill="url(#terrain)" opacity=".8"/>
  <ellipse cx="604" cy="310" rx="280" ry="76" fill="#E9B85D" fill-opacity=".35" filter="url(#shadow)"/>
  <path d="M0 0h1200v470H0z" fill="url(#glow)"/>

  <g opacity=".72">
    <g>
      <path d="M131 116c0-16 13-29 29-29 7-22 40-23 49 0 15 1 25 13 25 28 0 15-12 27-27 27h-49c-15 0-27-12-27-26Z" fill="#F7F5EF" fill-opacity=".18"/>
      <animateTransform attributeName="transform" type="translate" values="-20 0; 18 0; -20 0" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <path d="M914 92c0-13 11-24 24-24 6-18 33-19 41 0 12 1 21 11 21 23 0 13-10 23-23 23h-41c-12 0-22-10-22-22Z" fill="#F7F5EF" fill-opacity=".16"/>
      <animateTransform attributeName="transform" type="translate" values="18 0;-18 0;18 0" dur="15s" repeatCount="indefinite"/>
    </g>
  </g>

  <path d="m385 354 220-108 237 112-225 112-232-116Z" fill="#080C12" fill-opacity=".64"/>
  <path d="m398 343 207-101 225 108-213 105-219-112Z" stroke="#F7F5EF" stroke-opacity=".66" stroke-width="5"/>
  <path d="m417 352 189-92 202 98-194 96-197-102Z" stroke="#E9B85D" stroke-opacity=".42" stroke-width="2"/>
  <path d="m455 335 150-74M493 353l150-74M531 372l150-74M570 390l150-74M450 326l202 102M484 309l202 102M518 292l202 102M552 276l202 102" stroke="#CBD0D6" stroke-opacity=".22" stroke-width="3"/>

  <g>
    <path d="m468 163 137-68 139 68-141 70-135-70Z" fill="url(#containerTop)"/>
    <path d="m468 163 135 70v105l-135-68V163Z" fill="url(#front)"/>
    <path d="m603 233 141-70v102l-141 73V233Z" fill="#A9A49D"/>
    <path d="m480 167 122-61 124 61-126 62-120-62Z" stroke="#8A8B89" stroke-opacity=".35" stroke-width="3"/>
    <path d="M492 171v97m15-89v94m15-86v94m15-86v94m15-86v94m15-86v94m15-86v94" stroke="#737A82" stroke-opacity=".34" stroke-width="3"/>
    <path d="M624 223v99m16-107v98m16-106v98m16-106v98m16-106v98m16-106v98" stroke="#64676A" stroke-opacity=".48" stroke-width="3"/>
  </g>

  <g>
    <path d="m604 229 138-70 140 70-143 72-135-72Z" fill="url(#redTop)"/>
    <path d="m604 229 135 72v106l-135-70V229Z" fill="url(#redFront)"/>
    <path d="m739 301 143-72v101l-143 77V301Z" fill="#942B34"/>
    <path d="m616 233 124-63 125 63-126 64-123-64Z" stroke="#FFB2A6" stroke-opacity=".5" stroke-width="3"/>
    <path d="M628 237v99m15-91v99m15-91v99m15-91v99m15-91v99m15-91v99m15-91v99" stroke="#6E222C" stroke-opacity=".43" stroke-width="3"/>
    <path d="M760 293v101m16-109v101m16-109v101m16-109v101m16-109v101m16-109v101" stroke="#5E1C28" stroke-opacity=".48" stroke-width="3"/>
  </g>

  <g filter="url(#chipShadow)">
    <g transform="translate(255 205)">
      <rect width="74" height="74" rx="22" fill="#F7F5EF"/>
      <circle cx="37" cy="37" r="19" stroke="#B73A3D" stroke-width="3" stroke-dasharray="2 5"/>
      <path d="M37 24c-7 0-12 6-12 13s5 13 12 13 12-6 12-13-5-13-12-13Z" stroke="#B73A3D" stroke-width="2"/>
      <path d="M25 37h24M37 24c4 4 6 8 6 13s-2 9-6 13c-4-4-6-8-6-13s2-9 6-13Z" stroke="#B73A3D" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="translate" values="255 205;255 194;255 205" dur="4.5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(864 194)">
      <rect width="74" height="74" rx="22" fill="#F7F5EF"/>
      <path d="M20 43h14V56H20zM36 33h14v23H36zM52 22h7v34h-7z" fill="#B73A3D"/>
      <animateTransform attributeName="transform" type="translate" values="864 194;864 181;864 194" dur="5.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="60" y="72" fill="#F7F5EF" font-size="13" font-weight="700" letter-spacing="4">FREIGHT SCROLL HERO</text>
    <text x="60" y="405" fill="#F7F5EF" fill-opacity=".74" font-size="13" font-weight="700" letter-spacing="2">ONE TEAM. EVERY MILE.</text>
    <circle cx="945" cy="66" r="5" fill="#E9B85D">
      <animate attributeName="opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="962" y="71" fill="#F7F5EF" fill-opacity=".68" font-size="11" font-weight="700" letter-spacing="2">SCROLL TO MOVE</text>
  </g>
</svg>
